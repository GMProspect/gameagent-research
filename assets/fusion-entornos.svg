<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="t d"><title id="t">Fusión de entornos: dos rutas</title><desc id="d">Ruta uno: dos procesos sincronizan cámaras, imágenes y eventos. Ruta dos: mecánicas recreadas en un proceso anfitrión. El control neuronal conjunto sigue pendiente.</desc><rect width="1000" height="500" rx="20" fill="#101925"/><g font-family="Arial,sans-serif" fill="#e2eaf2"><text x="40" y="48" font-size="15" fill="#22d3ee">COMPOSICIÓN ESPACIAL Y TRANSFERENCIA DE INTERACCIONES</text><text x="40" y="95" font-size="27">Dos rutas, estados de ejecución distintos</text><g fill="#1b2d3d" stroke="#52687a"><rect x="40" y="140" width="435" height="240" rx="12"/><rect x="525" y="140" width="435" height="240" rx="12"/></g><text x="65" y="178" font-size="20" fill="#22d3ee">01 · Dos procesos enlazados</text><text x="550" y="178" font-size="20" fill="#ffad70">02 · Recreación nativa</text><g font-size="17"><text x="65" y="224">Entorno volumétrico ↔ anfitrión urbano</text><text x="65" y="260">Cámara · imagen · suelo · eventos</text><text x="65" y="296">Composición y diagnóstico del desfase</text><text x="65" y="342" font-size="14" fill="#abbcca">Fuentes y registro de sesión conservados</text><text x="550" y="224">Un proceso anfitrión</text><text x="550" y="260">Bloques · criaturas · fuego · explosivos</text><text x="550" y="296">Colisiones · vehículos · persistencia</text><text x="550" y="342" font-size="14" fill="#abbcca">Pruebas de interacciones concretas conservadas</text></g><text x="40" y="430" font-size="15" fill="#abbcca">El control neuronal del conjunto y la campaña completa siguen pendientes de validación.</text><text x="40" y="467" font-size="13" fill="#abbcca">Gustavo Adolfo Matheus González · Memoria de desarrollo · Noviembre 2026</text></g></svg>